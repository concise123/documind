name: DocuMind CI/CD

on:
  push:
    branches:
      - feature/docker
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: documind-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: |
          chmod +x ./gradlew
          ./gradlew test

      - name: Validate deployment configuration
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ "$AWS_REGION" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]] || {
            echo "Invalid AWS_REGION format."
            exit 1
          }

          [[ "$AWS_ROLE_ARN" =~ ^arn:aws(-[a-z]+)?:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$ ]] || {
            echo "Invalid AWS_ROLE_ARN format."
            exit 1
          }

          [[ "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]] || {
            echo "Invalid EC2_INSTANCE_ID format."
            exit 1
          }

          [[ "$ECR_REPOSITORY" == "documind" ]] || {
            echo "Unexpected ECR repository."
            exit 1
          }

          test -f deploy/deploy-ec2.sh
          echo "Deployment configuration validated."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ARM64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy through SSM Automation
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AUTOMATION_ROLE_ARN: ${{ vars.AUTOMATION_ROLE_ARN }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          [[ "$AWS_REGION" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]]
          [[ "$AUTOMATION_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/DocuMindAutomationRole$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]

          PARAMETERS_FILE="$(mktemp)"
          trap 'rm -f "$PARAMETERS_FILE"' EXIT

          jq -n \
            --arg digest "$IMAGE_DIGEST" \
            --arg role "$AUTOMATION_ROLE_ARN" \
            '{
              ImageDigest: [$digest],
              AutomationAssumeRole: [$role]
            }' > "$PARAMETERS_FILE"

          AUTOMATION_ID="$(aws ssm start-automation-execution \
            --region "$AWS_REGION" \
            --document-name "DocuMind-Deploy-With-Approval" \
            --parameters "file://${PARAMETERS_FILE}" \
            --query 'AutomationExecutionId' \
            --output text)"

          [[ "$AUTOMATION_ID" =~ ^[a-fA-F0-9-]{36}$ ]]

          echo "Automation execution started: ${AUTOMATION_ID}"
          echo "Waiting for approval and deployment completion."

          STATUS="Pending"
          PREVIOUS_STATUS=""

          # 최대 65분 대기: 승인 제한 시간 60분 + 여유 시간
          for attempt in $(seq 1 780); do
            STATUS="$(aws ssm get-automation-execution \
              --region "$AWS_REGION" \
              --automation-execution-id "$AUTOMATION_ID" \
              --query 'AutomationExecution.AutomationExecutionStatus' \
              --output text)"

            if [[ "$STATUS" != "$PREVIOUS_STATUS" ]]; then
              echo "Automation status: ${STATUS}"
              PREVIOUS_STATUS="$STATUS"
            fi

            case "$STATUS" in
              Success|CompletedWithSuccess)
                echo "Deployment completed successfully."
                exit 0
                ;;

              Failed|TimedOut|Cancelled|Rejected|CompletedWithFailure|Exited|ChangeCalendarOverrideRejected)
                echo "Automation failed: ${STATUS}" >&2

                aws ssm get-automation-execution \
                  --region "$AWS_REGION" \
                  --automation-execution-id "$AUTOMATION_ID" \
                  --query 'AutomationExecution.{Status:AutomationExecutionStatus,FailureMessage:FailureMessage,StepExecutions:StepExecutions[*].{Step:StepName,Status:StepStatus,FailureMessage:FailureMessage}}' \
                  --output json || true

                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for approval or deployment." >&2
          echo "Automation execution: ${AUTOMATION_ID}" >&2
          exit 1
